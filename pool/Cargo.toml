[package]
name = "refract-pool"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { workspace = true }
refract-interfaces = { path = "../interfaces" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils", "alloc"] }
# Dev-only: the pool calls the registry, oracle, and backstop purely through
# env.invoke_contract() with locally-mirrored ABIs (see the cross-contract
# wiring note in src/lib.rs) so no contract code leaks into the pool's wasm.
# Tests still want the real contracts deployed in-process to exercise the
# calls end-to-end, hence dev-dependencies only.
refract-policy = { path = "../policy" }
refract-oracle = { path = "../oracle" }
refract-backstop = { path = "../backstop", features = ["testutils"] }
proptest = { workspace = true }
