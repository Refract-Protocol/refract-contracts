[package]
name = "refract-registry"
version = "0.1.0"
edition = "2021"
description = "Timelock-governed registry of trusted Refract contract ids"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
refract-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
refract-timelock = { path = "../timelock" }

[features]
testutils = ["soroban-sdk/testutils"]
