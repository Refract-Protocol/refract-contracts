[package]
name = "refract-registry"
version = "0.1.0"
edition = "2021"
description = "Trusted contract-ID allowlist registry for Refract cross-contract calls"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
