[package]
name = "refract-governance"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { workspace = true }
refract-interfaces = { path = "../interfaces" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
refract-vetoken = { path = "../vetoken" }
refract-backstop = { path = "../backstop", features = ["testutils"] }
refract-timelock = { path = "../timelock" }
