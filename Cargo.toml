[workspace]
resolver = "2"
members = ["common", "pool", "policy", "oracle", "incident_response", "vetoken", "timelock", "multisig", "governance", "backstop", "bounty", "grants", "treasury"]

[workspace.dependencies]
soroban-sdk = { version = "21.0.0", features = ["alloc"] }
refract-common = { path = "common" }
proptest = "1.5.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
