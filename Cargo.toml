[workspace]
resolver = "2"
members = [
    "harness",
    "tests",
    "timelock",
    "multisig",
    "integration",
    "payout_registry",
    "backstop",
    "bounty",
    "grants",
    "treasury",
    "governance",
    "vetoken",
    "pool",
    "policy",
    "oracle",
    "incident_response",
    "params",
    "snapshot_harness",
    "xtask",
]
exclude = [
    "pool",
    "policy",
    "oracle",
    "incident_response",
    "governance",
    "vetoken",
    "timelock",
    "multisig",
    "snapshot_harness",
    "xtask",
]

[workspace.dependencies]
soroban-sdk = { version = "21.0.0" }
proptest = "1.5.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
