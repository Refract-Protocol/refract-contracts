[workspace]
resolver = "2"
members = [
    "pool",
    "policy",
    "oracle",
    "incident_response",
    "vetoken",
    "timelock",
    "multisig",
    "governance",
    "backstop",
    "bounty",
    "grants",
    "treasury",
    "testutils",
]

[workspace.dependencies]
soroban-sdk = { version = "21.0.0", features = ["alloc"] }
proptest = "1.5.0"
refract-testutils = { path = "testutils" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
