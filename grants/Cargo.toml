[package]
name = "refract-grants"
version = "0.1.0"
edition = "2021"
description = "Milestone-based community grants with review, appeals and resilient payouts"
license = "MIT"

[lib]
name = "refract_grants"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
refract-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
refract-common = { path = "../common", features = ["testutils"] }
refract-registry = { path = "../registry" }
refract-timelock = { path = "../timelock" }
