[package]
name = "refract-grants"
version = "0.1.0"
edition = "2021"
description = "Refract milestone-based ecosystem grant contract"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
