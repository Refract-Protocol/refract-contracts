[package]
name = "refract-grants"
version = "0.1.0"
edition = "2021"
description = "Milestone-based community grants disbursement for Refract"
license = "MIT"

[lib]
name = "refract_grants"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
refract-interfaces = { path = "../interfaces" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
