[package]
name = "refract-grants"
version = "0.1.0"
edition = "2021"
description = "Milestone-based community grants disbursement for Refract"
license = "MIT"

[lib]
name = "refract_grants"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
soroban-sdk = { version = "21.0.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["alloc", "testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
