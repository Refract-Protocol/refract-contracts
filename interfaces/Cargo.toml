[package]
name = "refract-interfaces"
version = "0.1.0"
edition = "2021"
description = "Shared cross-contract clients, value types, access control and the unified RefractError enum"
license = "MIT"

# rlib only: this crate defines no #[contract] type, so it must never be
# built as a wasm artifact of its own (see the crate docs in src/lib.rs).
[lib]
crate-type = ["rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
