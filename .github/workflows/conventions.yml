name: PR Conventions Enforcement

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  validate-conventions:
    name: Verify PR Title & Issue Reference
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            chore
            perf
            ci
          requireScope: false

      - name: Verify Issue Reference in PR Body
        run: |
          BODY="${{ github.event.pull_request.body }}"
          if echo "$BODY" | grep -iqE "(closes|fixes|resolves) #[0-9]+"; then
            echo "PR links to an issue correctly."
          else
            echo "ERROR: PR body must reference an issue using 'Closes #<id>', 'Fixes #<id>', or 'Resolves #<id>'."
            exit 1
          fi
