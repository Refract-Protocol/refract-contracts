name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: fmt · clippy · test · wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --all

      - name: Build optimized wasm
        run: cargo build --target wasm32-unknown-unknown --release

  # Test coverage for host-run unit tests (the wasm32 build is not
  # instrumented). Uses the test profile only; the release profile in
  # Cargo.toml is untouched. Branch coverage needs nightly, so the nightly
  # is pinned here; bump it on purpose. See README "Coverage".
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base commit is needed for the PR delta and floor guard

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-20
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage # instrumented artefacts differ from the test job's

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Measure coverage
        run: python3 scripts/coverage.py run

      # Best effort: if the base can't be measured, the report says there's
      # no delta instead of failing the PR.
      - name: Measure base-branch coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git worktree add ../coverage-base "${{ github.event.pull_request.base.sha }}"
          python3 scripts/coverage.py run --src ../coverage-base --out target/coverage-base

      - name: Report coverage and enforce floors
        run: |
          python3 scripts/coverage.py report \
            ${{ github.event_name == 'pull_request' && '--base target/coverage-base' || '' }}

      - name: Guard against lowered floors
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'coverage-floor-lowered')
        run: |
          python3 scripts/coverage.py floor-guard "${{ github.event.pull_request.base.sha }}" || {
            echo "::error::coverage-floor.toml lowers a floor. If that's intended, add the 'coverage-floor-lowered' label and explain why in the PR."
            exit 1
          }

      # Every test Env writes test_snapshots/; `coverage.py run` restores
      # them. Checked here so a leftover can't go unnoticed.
      - name: Working tree is clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            target/coverage/html
            target/coverage/lcov.info
            target/coverage/summary.json
            target/coverage/uncovered.md
          if-no-files-found: warn
          retention-days: 14
