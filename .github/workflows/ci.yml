name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: fmt · clippy · test · wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --all

      - name: Build optimized wasm
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Run wasm-level tests
        run: cargo test --all -- wasm_test

      - name: Backstop stress scenarios (issue #283)
        run: cargo test -p refract-backstop --test stress -- --nocapture --test-threads=1

      - name: Soroban static-analysis gate
        run: python3 scripts/check_soroban_footguns.py

      - name: SDK upgrade verification gate
        run: python3 scripts/verify_sdk_upgrade.py

      - name: Script unit tests (contract_state snapshot/reconcile)
        run: python3 -m unittest discover -s scripts/tests -v

  # Issue #221: Soroban CPU/memory budgets for backstop, bounty, grants and
  # treasury. Fails if any entrypoint exceeds its ceiling in
  # resource_budgets.json; the diff table goes to the job summary.
  resource-budgets:
    name: resource budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check resource budgets
        run: cargo xtask budget-check

  # Issue #222: deploy, initialise, wire and verify against a local Soroban
  # sandbox, then re-run to prove the script is idempotent.
  # pool, policy, oracle and governance are left out until they compile
  # again on main; add them to DEPLOY_ONLY when they do.
  deploy-sandbox:
    name: deploy dry-run (local sandbox)
    runs-on: ubuntu-latest
    env:
      STELLAR_CLI_VERSION: "28.1.0"
      DEPLOY_ONLY: refract_multisig,refract_timelock,refract_treasury,refract_vetoken,refract_incident_response,refract_backstop,refract_bounty,refract_grants
      RPC: http://localhost:8000/rpc
      PASSPHRASE: "Standalone Network ; February 2017"
    steps:
      - uses: actions/checkout@v7

      - name: Start Soroban sandbox
        run: docker run -d --name sandbox -p 8000:8000 stellar/quickstart:latest --local --enable core,rpc

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI
        run: |
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | sudo tar xz -C /usr/local/bin stellar
          stellar --version

      - name: Build, optimise and collect wasm
        run: |
          pkgs=""
          for c in ${DEPLOY_ONLY//,/ }; do pkgs="$pkgs -p ${c//_/-}"; done
          cargo build --target wasm32-unknown-unknown --release $pkgs
          # Rust >= 1.82 emits wasm the Soroban VM rejects (reference-types
          # encoding); the optimiser rewrites it into a valid MVP module.
          for f in target/wasm32-unknown-unknown/release/refract_*.wasm; do
            stellar contract optimize --wasm "$f" --wasm-out "$f"
          done
          python3 scripts/wasm_manifest.py collect --out dist/wasm --skip-missing

      - name: Wait for sandbox and fund deployer
        run: |
          for i in $(seq 90); do
            curl -s -X POST "$RPC" -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' | grep -q healthy && break
            sleep 4
          done
          stellar keys generate deployer --rpc-url "$RPC" --network-passphrase "$PASSPHRASE" --fund

      - name: Deploy, initialise, wire, verify
        run: python3 scripts/deploy.py deploy --network local --only "$DEPLOY_ONLY"

      - name: Re-run (must be a no-op)
        run: python3 scripts/deploy.py deploy --network local --only "$DEPLOY_ONLY"

      - name: Publish registry
        run: |
          { echo '### deployments/local.json'; echo '```json'; cat deployments/local.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Issue #131 (plan): add a `miri` job here:
  #   - dtolnay/rust-toolchain@nightly with components: miri
  #   - cargo miri setup
  #   - cargo miri test -p refract-pool -p refract-policy -p refract-oracle
  #     with MIRIFLAGS="-Zmiri-disable-isolation" (the soroban test Env reads
  #     the clock/RNG).
  # Miri runs the native test harness, not the wasm32 artifact. It
  # validates the logic the tests exercise, not the wasm runtime.
  # Proptest suites (pricing_proptest.rs, registry_proptest.rs) are too
  # slow under Miri: gate them with #[cfg_attr(miri, ignore)] and a comment.
  # Any finding inside soroban-sdk/test harness internals is suppressed the
  # same way, with a justification and an upstream issue link; genuine UB in
  # this repo gets fixed. Findings are recorded in MIRI.md.
  # Blocked until the pool crate compiles again (see the #174 note in
  # pool/src/lib.rs).

  docs:
    name: rustdoc · links · coverage
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -D rustdoc::invalid_html_tags"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check documentation coverage & intra-doc links
        run: cargo doc --workspace --no-deps

      - name: Check markdown cross-references and links
        run: python3 scripts/check_links.py

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: refract-contracts-docs
          path: target/doc

