name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: fmt · clippy · test · wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --all

      - name: Build optimized wasm
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Run wasm-level tests
        run: cargo test --all -- wasm_test

      - name: Soroban static-analysis gate
        run: python3 scripts/check_soroban_footguns.py

      - name: SDK upgrade verification gate
        run: python3 scripts/verify_sdk_upgrade.py

  docs:
    name: rustdoc · links · coverage
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links -D rustdoc::private_intra_doc_links -D rustdoc::invalid_html_tags"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check documentation coverage & intra-doc links
        run: cargo doc --workspace --no-deps

      - name: Check markdown cross-references and links
        run: python3 scripts/check_links.py

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: refract-contracts-docs
          path: target/doc

