# Weekly run of the Kani proofs in backstop/src/kani_proofs.rs.
#
# Kani runs only under `cargo kani`, so these proofs add nothing to the
# per-PR test job. This job is scheduled and can also be started by hand.
# Local run: `cargo kani -p refract-backstop`.

name: kani

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: model-checking/kani-github-action@v1
        with:
          args: '-p refract-backstop'
