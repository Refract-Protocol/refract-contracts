[package]
name = "snapshot_harness"
version = "0.1.0"
edition = "2021"
description = "Load captured Soroban ledger snapshots into the test environment"
license = "MIT"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
soroban-sdk = { workspace = true, features = ["testutils"] }
