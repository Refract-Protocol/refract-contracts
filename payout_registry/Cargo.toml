[package]
name = "refract-payout-registry"
version = "0.1.0"
edition = "2021"
description = "Queryable sidecar payout index for Refract bounties and grants"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils", "alloc"] }
