# Supply-chain, advisory, license, duplicate-version, and source policy for the
# Refract workspace (including `backstop`, `bounty`, `grants`, and `treasury`).
#
# Checked in CI by the `deny` job in `.github/workflows/audit.yml`:
#
#   cargo deny --workspace check advisories licenses bans sources
#
# Scoped to the default workspace target set (`[graph] all-features = false`) so
# host + contract dependency graphs are resolved in a single fast workspace pass
# without rebuilding contract WASM binaries. Time-boxed advisory exceptions with
# mandatory expiry dates continue to be tracked in `audit.toml` (enforced by
# `scripts/audit.py`); `deny.toml` enforces yanked-crate, license, wildcard/ban,
# and source-origin gates across the entire workspace.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
db-paths = ["~/.cargo/advisory-db"]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
notice = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# Permissive licenses compatible with this repository's MIT `LICENSE`.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]

[licenses.private]
ignore = true

[bans]
# Warn on transitive duplicate versions pulled by `soroban-sdk` vs host test
# crates (`syn`, `rand_core`, `hashbrown`); deny wildcard version specs outright.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
# Only crates published to crates.io (and workspace path dependencies) are
# permitted; unverified git dependencies and alternate registries are denied.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
