[package]
name = "refract-params"
version = "0.1.0"
edition = "2021"
description = "Governance-owned parameter registry contract for Refract Protocol"
license = "MIT"

[lib]
name = "refract_params"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "21.0.0" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
refract-testutils = { path = "../testutils" }

[features]
testutils = ["soroban-sdk/testutils"]
