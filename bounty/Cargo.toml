[package]
name = "refract-bounty"
version = "0.1.0"
edition = "2021"
description = "Governance-controlled on-chain bug bounty escrow for Refract"
license = "MIT"

[lib]
name = "refract_bounty"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
refract-interfaces = { path = "../interfaces" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
