[package]
name = "refract-bounty"
version = "0.1.0"
edition = "2021"
description = "Governance-controlled on-chain bug bounty escrow for Refract"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
