[package]
name = "refract-bounty"
version = "0.1.0"
edition = "2021"
description = "RefractBountyEscrow — governance-controlled bug bounty with recipient allowlist (issue #244)"
license = "MIT"

[lib]
name = "refract_bounty"
crate-type = ["lib", "cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
refract-math = { path = "../math" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
