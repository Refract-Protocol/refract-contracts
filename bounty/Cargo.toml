[package]
name = "refract-bounty"
version = "0.1.0"
edition = "2021"
description = "Governance-controlled on-chain bug bounty escrow for Refract"
license = "MIT"

[lib]
name = "refract_bounty"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "21.0.0" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
