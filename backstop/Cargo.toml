[package]
name = "refract-backstop"
version = "0.1.0"
edition = "2021"
description = "RefractBackstop — second-loss capital with pro-rata share model and protocol-owned seed accounting (issue #243)"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
refract-common = { path = "../common" }
refract-math = { path = "../math" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
refract-common = { path = "../common", features = ["testutils"] }
refract-registry = { path = "../registry" }
proptest = { workspace = true }

[features]
testutils = ["soroban-sdk/testutils"]
