[package]
name = "refract-backstop"
version = "0.1.0"
edition = "2021"
description = "RefractBackstop — second-loss capital with pro-rata share model and protocol-owned seed accounting (issue #243)"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
