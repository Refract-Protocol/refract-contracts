[package]
name = "refract-vetoken"
version = "0.1.0"
edition = "2021"
description = "Refract veToken-style staking contract for governance weight and fee-sharing"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
refract-interfaces = { path = "../interfaces" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
refract-backstop = { path = "../backstop", features = ["testutils"] }
