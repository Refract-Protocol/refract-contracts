[package]
name = "refract-treasury"
version = "0.1.0"
edition = "2021"
description = "Minimal token-custody treasury vault for Refract"
license = "MIT"

[lib]
name = "refract_treasury"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
