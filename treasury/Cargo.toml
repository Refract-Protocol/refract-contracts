[package]
name = "refract-treasury"
version = "0.1.0"
edition = "2021"
description = "Minimal token-custody treasury contract for Refract"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "21.0.0" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
refract-testutils = { path = "../testutils" }

[features]
testutils = ["soroban-sdk/testutils"]
