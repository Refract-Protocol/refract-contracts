[package]
name = "refract-treasury"
version = "0.1.0"
edition = "2021"
description = "Refract token-custody vault with source-tagged inflow accounting"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
