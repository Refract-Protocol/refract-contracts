[package]
name = "refract-treasury"
version = "0.1.0"
edition = "2021"
description = "Protocol treasury contract for the Refract protocol"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "21.0.0" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
