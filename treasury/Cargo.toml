[package]
name = "refract-treasury"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
refract-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
refract-common = { path = "../common", features = ["testutils"] }
refract-registry = { path = "../registry" }
