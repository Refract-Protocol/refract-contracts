[package]
name = "refract-treasury"
version = "0.1.0"
edition = "2021"
description = "Treasury custody vault with spending policy for Refract"
license = "MIT"

[lib]
name = "refract_treasury"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
