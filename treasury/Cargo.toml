[package]
name = "refract-treasury"
version = "0.1.0"
edition = "2021"
description = "RefractTreasury — token custody, NAV snapshots (issue #245), recipient allowlist (issue #244), and backstop seeding (issue #243)"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
refract-math = { path = "../math" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
